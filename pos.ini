[products]
#格式為 Label ID: [品名, 單價(每重量單位或每個), 計價單位]
#計價單位 --> twkg:台斤, kg:公斤, gram:公克, one:一個
labels_tw = {"v1":["蓮藕", 36, "twkg"], "v2":["小蕃茄", 25, "twkg"], "v3":["綠彩椒",30, "twkg"], "v4":["紅彩椒",30, "twkg"], \
    "v5":["黃彩椒",30, "twkg"], "v6":["茄子", 18, "twkg"], "v7":["老薑",21, "twkg"], "v8":["綠辣椒",8, "twkg"],\
    "v9":["紅辣椒",8, "twkg"], "v10":["黃椒",15, "twkg"], "v11":["青椒",15, "twkg"], "v12":["蒜頭",6, "twkg"],\
    "v13":["雞蛋",11, "twkg"], "v14":["紅蘿蔔",32, "twkg"], "v15":["馬玲薯",10, "twkg"], "v16":["洋菇",6, "twkg"], "v17":["大白菜",52, "twkg"], \
    "v18":["玉米",21, "twkg"], "v19":["小南瓜",60, "twkg"], "v20":["牛蕃茄",26, "twkg"], "v21":["紫地瓜",26, "twkg"]}  

[camera]
cam_id = 0
#(H, V) 是否水平或垂直翻轉畫面
flipFrame = (False,False)
#是否將過程錄製成影片
record_video = True
#影片檔名
video_out = output.avi
#每秒幀數
frame_rate = 2

[desktop]
#背景圖片的路徑檔名
bg = images/bg.jpg
click_bg = images/bgClick.jpg
#(y,x) 購物車的顯示尺寸
cart_list_size = (350,250)
#僅僅顯示用, 偵測種類
detection_txt = 蔬菜

[operation]
#TW, EN
lang = tw
#seconds 商品結帳的結果, 要顯示幾秒
wait_for_next = 3

[yoloModel]
#yolov3-tiny, yolov3 可選擇YOLO-Tiny或YOLOV3版本
modeltype = yolov3-tiny
objnames = model/obj.names
weights = model/yolov3-tiny_81000.weights
cfg = model/yolov3-tiny.cfg

[system]
#是否切換到全螢幕來執行
full_screen = True
name_win = AI_POS
